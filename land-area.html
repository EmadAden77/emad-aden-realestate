<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>حاسبة مساحة الأرض</title>

<style>

body{
margin:0;
background:#111;
color:#fff;
font-family:Tahoma,Arial,sans-serif;
}

header{
text-align:center;
padding:30px;
background:#181818;
border-bottom:3px solid #d4af37;
}

.logo{
width:90px;
border-radius:12px;
}

h1{
color:#d4af37;
margin-top:15px;
}

.container{
max-width:450px;
margin:30px auto;
padding:25px;
background:#1c1c1c;
border-radius:15px;
border:1px solid #333;
}

label{
display:block;
margin-top:15px;
margin-bottom:8px;
}

input{
width:100%;
padding:12px;
font-size:18px;
border:none;
border-radius:8px;
box-sizing:border-box;
}

button{
width:100%;
padding:15px;
margin-top:20px;
background:#d4af37;
color:#111;
font-size:18px;
font-weight:bold;
border:none;
border-radius:10px;
cursor:pointer;
}

.result{
margin-top:25px;
background:#222;
padding:20px;
border-radius:10px;
text-align:center;
font-size:22px;
color:#d4af37;
}

.back{
display:block;
text-align:center;
margin-top:25px;
color:#d4af37;
text-decoration:none;
font-weight:bold;
}

</style>

</head>

<body>

<header>

<img src="../IMG_5.jpg" class="logo">

<h1>حاسبة مساحة الأرض</h1>

<p>مكتب عماد عدن العقاري</p>

</header>

<div class="container">

<label>الطول (بالمتر)</label>
<input type="number" id="length">

<label>العرض (بالمتر)</label>
<input type="number" id="width">

<button onclick="calc()">احسب المساحة</button>

<div class="result" id="result">

أدخل البيانات ثم اضغط احسب

</div>

<a class="back" href="../index.html">
⬅ العودة للصفحة الرئيسية
</a>

</div>

<script>

function calc(){

let l=parseFloat(document.getElementById("length").value);

let w=parseFloat(document.getElementById("width").value);

if(isNaN(l)||isNaN(w)){

document.getElementById("result").innerHTML="يرجى إدخال الطول والعرض.";

return;

}

let area=l*w;

document.getElementById("result").innerHTML=

"المساحة = "+area.toFixed(2)+" متر²";

}

</script>

</body>
</html>
