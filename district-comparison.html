<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مقارنة مديريات عدن عقارياً</title><meta name="description" content="مقارنة إرشادية بين مديريات عدن من حيث الطلب والخدمات والمخاطر والفرصة الاستثمارية."><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><style>:root{--g:#E5C07B;--m:#AAB3C2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a1a1a,#050505);color:#fff;font-family:Tajawal,Arial;line-height:1.8}.w{width:min(1100px,calc(100% - 28px));margin:auto}.top{padding:24px 0;border-bottom:1px solid rgba(229,192,123,.2)}a{text-decoration:none;color:inherit}.g{color:var(--g)}main{padding:42px 0}.controls{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin:20px 0}.controls select{padding:13px;border-radius:14px;background:#0b0b0d;color:#fff;border:1px solid rgba(255,255,255,.1);font-family:inherit}.cards{display:grid;grid-template-columns:1fr 1fr;gap:18px}.card{background:rgba(18,18,21,.9);border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:22px}.row{display:flex;justify-content:space-between;border-top:1px solid rgba(255,255,255,.06);padding:12px 0}.score{font-size:2rem;color:var(--g);font-weight:900}@media(max-width:700px){.controls,.cards{grid-template-columns:1fr}}</style>

</head><body><header class="top"><div class="w"><a class="g" href="index.html"><strong>مكتب عماد عدن العقاري</strong></a></div></header><main class="w"><h1>مقارنة مديريات عدن</h1><p style="color:var(--m)">اختر منطقتين للمقارنة السريعة. الأرقام إرشادية، فالشارع الواحد قد يقرر مخالفة متوسط المديرية بكل ثقة بشرية.</p><div class="controls"><select id="a"></select><select id="b"></select></div><section class="cards"><div class="card" id="cardA"></div><div class="card" id="cardB"></div></section></main><script>const data={"خور مكسر":['مرتفع','جيدة','متوسطة','تجاري وإداري','9/10'],"المنصورة":['مرتفع','جيدة','منخفضة','سكني وخدمي','8.7/10'],"المعلا":['مرتفع','جيدة','متوسطة','مكاتب وتجاري','8.4/10'],"الشيخ عثمان":['مرتفع','جيدة','متوسطة','إيجار ومحلات','8.3/10'],"دار سعد":['متوسط إلى مرتفع','متوسطة','متوسطة','توسع سكني','7.8/10'],"البريقة":['متوسط','متوسطة','متوسطة','أراضٍ واستثمار طويل','7.5/10']};const names=Object.keys(data),a=document.getElementById('a'),b=document.getElementById('b');[a,b].forEach(s=>s.innerHTML=names.map(n=>`<option>${n}</option>`).join(''));b.selectedIndex=1;function draw(id,n){const d=data[n];document.getElementById(id).innerHTML=`<h2>${n}</h2><div class="score">${d[4]}</div><div class="row"><span>الطلب</span><b>${d[0]}</b></div><div class="row"><span>الخدمات</span><b>${d[1]}</b></div><div class="row"><span>المخاطر</span><b>${d[2]}</b></div><div class="row"><span>الأنسب</span><b>${d[3]}</b></div>`}function update(){draw('cardA',a.value);draw('cardB',b.value)}a.onchange=b.onchange=update;update();</script></body></html>
