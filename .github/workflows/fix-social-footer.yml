name: Fix social footer placement

on:
  push:
    branches:
      - fix-social-footer-placement
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix-social-footer-placement
      - name: Apply social footer
        run: python scripts/fix-social-footer.py
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "إضافة روابط التواصل في موضع التذييل المحدد"
          git push origin HEAD:fix-social-footer-placement
