name: Inject back to top button

on:
  push:
    branches:
      - add-back-to-top-button
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inject:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: add-back-to-top-button
      - name: Add script reference to homepage
        shell: python
        run: |
          from pathlib import Path

          path = Path('index.html')
          html = path.read_text(encoding='utf-8')
          script = '<script src="assets/js/back-to-top.js" defer></script>'

          if script in html:
              print('Back-to-top script already linked')
              raise SystemExit(0)

          marker = '</body>'
          if marker not in html:
              raise SystemExit('Closing body tag not found')

          html = html.replace(marker, script + marker, 1)
          path.write_text(html, encoding='utf-8')
      - name: Commit homepage update
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "ربط زر العودة إلى أعلى الصفحة"
          git push origin HEAD:add-back-to-top-button
