<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>حاسبة القيمة العقارية التقديرية</title><meta name="description" content="حاسبة أولية لتقدير نطاق قيمة العقار في عدن حسب المساحة والمنطقة ونوع العقار."><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><style>:root{--g:#E5C07B;--p:#121215;--m:#AAB3C2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a1a1a,#050505);color:#fff;font-family:Tajawal,Arial;line-height:1.8}.w{width:min(900px,calc(100% - 28px));margin:auto}.top{padding:24px 0;border-bottom:1px solid rgba(229,192,123,.2)}a{text-decoration:none;color:inherit}.g{color:var(--g)}main{padding:46px 0}.box{background:rgba(18,18,21,.9);border:1px solid rgba(255,255,255,.07);border-radius:26px;padding:24px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.field label{display:block;margin-bottom:7px;color:#DDE3EB;font-weight:800}.field input,.field select{width:100%;padding:13px 14px;border-radius:14px;border:1px solid rgba(255,255,255,.1);background:#09090b;color:#fff;font-family:inherit}.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--g),#B8860B);font-weight:900;cursor:pointer}.result{margin-top:18px;padding:18px;border-radius:18px;background:rgba(229,192,123,.07);border:1px solid rgba(229,192,123,.2)}.note{color:var(--m);font-size:.9rem}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style></head><body><header class="top"><div class="w"><a href="index.html" class="g"><strong>مكتب عماد عدن العقاري</strong></a></div></header><main class="w"><h1>حاسبة القيمة العقارية التقديرية</h1><p class="note">نتيجة أولية للتوجيه فقط، لأن العقار لا يطيع آلة حاسبة بكل تهذيب كما نتمنى.</p><section class="box"><div class="grid"><div class="field"><label>المساحة بالمتر المربع</label><input id="area" type="number" min="1" value="120"></div><div class="field"><label>المنطقة</label><select id="district"><option value="1.25">خور مكسر</option><option value="1.15">المنصورة</option><option value="1.1">المعلا</option><option value="1.05">الشيخ عثمان</option><option value=".95">دار سعد</option><option value=".9">البريقة</option></select></div><div class="field"><label>نوع العقار</label><select id="type"><option value="1">أرض</option><option value="1.35">شقة</option><option value="1.55">محل تجاري</option><option value="1.75">مبنى كامل</option></select></div><div class="field"><label>حالة الموقع</label><select id="condition"><option value="1">متوسط</option><option value="1.15">مميز</option><option value=".85">يحتاج تطوير</option></select></div></div><button class="btn" id="calc">احسب التقدير الأولي</button><div class="result" id="result">أدخل البيانات واضغط على الحساب.</div></section></main><script>document.getElementById('calc').onclick=()=>{const a=+document.getElementById('area').value||0,d=+document.getElementById('district').value,t=+document.getElementById('type').value,c=+document.getElementById('condition').value;base=350000;const mid=a*d*t*c*base,low=Math.round(mid*.85),high=Math.round(mid*1.15);document.getElementById('result').innerHTML=`<strong class="g">النطاق التقديري:</strong><br>${low.toLocaleString('ar-EG')} إلى ${high.toLocaleString('ar-EG')} ريال يمني<br><span class="note">هذا تقدير إرشادي لا يغني عن التثمين والمعاينة وفحص المستندات.</span>`}</script></body></html>
