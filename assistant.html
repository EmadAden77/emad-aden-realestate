<!DOCTYPE html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المساعد العقاري الذكي</title><meta name="description" content="مساعد عقاري إرشادي يقترح مديريات مناسبة في عدن حسب الميزانية والغرض ونوع العقار."><link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;700;800;900&display=swap" rel="stylesheet"><style>:root{--g:#E5C07B;--m:#AAB3C2}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top,#1a1a1a,#050505);color:#fff;font-family:Tajawal,Arial;line-height:1.8}.w{width:min(900px,calc(100% - 28px));margin:auto}.top{padding:24px 0;border-bottom:1px solid rgba(229,192,123,.2)}a{text-decoration:none;color:inherit}.g{color:var(--g)}main{padding:46px 0}.card{background:rgba(18,18,21,.9);border:1px solid rgba(255,255,255,.07);border-radius:24px;padding:24px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.field label{display:block;font-weight:800;margin-bottom:7px}.field select,.field input{width:100%;padding:13px;border-radius:14px;background:#0a0a0c;color:#fff;border:1px solid rgba(255,255,255,.1);font-family:inherit}.btn{width:100%;margin-top:16px;padding:14px;border:0;border-radius:14px;background:linear-gradient(135deg,var(--g),#B8860B);font-weight:900}.result{margin-top:18px;padding:18px;border:1px solid rgba(229,192,123,.2);border-radius:18px;background:rgba(229,192,123,.06)}@media(max-width:650px){.grid{grid-template-columns:1fr}}</style>

</head><body><header class="top"><div class="w"><a href="index.html" class="g"><strong>مكتب عماد عدن العقاري</strong></a></div></header><main class="w"><h1>المساعد العقاري الذكي</h1><p style="color:var(--m)">اقتراح أولي حسب احتياجك، وليس حكماً نهائياً من آلة تحب التظاهر باليقين.</p><section class="card"><div class="grid"><div class="field"><label>الغرض</label><select id="purpose"><option value="investment">استثمار</option><option value="housing">سكن</option><option value="commercial">تجاري</option></select></div><div class="field"><label>نوع العقار</label><select id="type"><option>أرض</option><option>شقة</option><option>محل</option><option>مبنى</option></select></div><div class="field"><label>مستوى الميزانية</label><select id="budget"><option value="low">محدودة</option><option value="medium">متوسطة</option><option value="high">مرتفعة</option></select></div><div class="field"><label>الأولوية</label><select id="priority"><option value="services">الخدمات</option><option value="growth">النمو المستقبلي</option><option value="liquidity">سهولة البيع والتأجير</option></select></div></div><button class="btn" id="recommend">اعرض الاقتراح</button><div class="result" id="result">اختر بياناتك ثم اضغط على الزر.</div></section></main><script>const matrix={investment:{low:['دار سعد','البريقة'],medium:['المنصورة','الشيخ عثمان'],high:['خور مكسر','التواهي']},housing:{low:['دار سعد','الشيخ عثمان'],medium:['المنصورة','المعلا'],high:['خور مكسر','التواهي']},commercial:{low:['الشيخ عثمان','صيرة'],medium:['المنصورة','المعلا'],high:['خور مكسر','التواهي']}};document.getElementById('recommend').onclick=()=>{const p=document.getElementById('purpose').value,b=document.getElementById('budget').value,pri=document.getElementById('priority').value,list=matrix[p][b];const reason=pri==='services'?'لقرب الخدمات والمحاور':pri==='growth'?'لارتباطها بفرص النمو والتوسع':'لارتفاع الحركة والطلب النسبي';document.getElementById('result').innerHTML=`<strong class="g">الاقتراح الأولي:</strong> ${list.join(' أو ')}<br>${reason}. يجب فحص الشارع والمخطط والوضع القانوني قبل القرار.`}</script></body></html>
