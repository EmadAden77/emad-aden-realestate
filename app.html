<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow">
  <meta name="description" content="تشغيل تطبيق مكتب عماد عدن العقاري والوصول إلى خدمات الموقع من الشاشة الرئيسية.">
  <meta name="theme-color" content="#E5C07B">
  <meta name="color-scheme" content="dark">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="مكتب عماد عدن العقاري">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/IMG_5.jpg">
  <title>مكتب عماد عدن العقاري</title>
</head>
<body>
<script>
(function () {
  var target = '/?source=pwa';

  function openSite() {
    location.replace(target);
  }

  if (!('serviceWorker' in navigator)) {
    openSite();
    return;
  }

  navigator.serviceWorker.register('/sw.js', { scope: '/' })
    .then(function (registration) {
      registration.update().catch(function () {});
      openSite();
    })
    .catch(openSite);
})();
</script>
<noscript>
  <meta http-equiv="refresh" content="0;url=/?source=pwa">
</noscript>
</body>
</html>
